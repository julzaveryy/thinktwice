name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Release APK (minified)
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: think-twice-debug-apk-jdk${{ matrix.java }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Installs the minified release APK on an emulator, launches it and drives it with
  # random taps for a while. Fails if the app crashes (catches R8 / startup issues).
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.miqu.thinktwice/.MainActivity
            sleep 10
            adb shell monkey -p com.miqu.thinktwice --throttle 150 --pct-syskeys 0 -s 7 1500
            sleep 3
            adb logcat -d -b crash > crash.txt; cat crash.txt; ! grep -q "com.miqu.thinktwice" crash.txt
